<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Flipbook Invitation | Dickson & Michelle</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=IM+Fell+DW+Pica:ital@0;1&family=Montserrat:wght@200;300;400;600;700&family=Pinyon+Script&family=Playfair+Display:ital,wght@0,700;1,400&family=Satisfy&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #060e1f;
    --pastel-blue: #bfe3f0;
    --light-pastel-blue: #e0f2f7;
    --pastel-blue-glass: rgba(174, 198, 207, 0.7);
    --maroon-nav: #6b0f0f;
    --text-main: #ffffff;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    background: radial-gradient(ellipse at center, #0d1a35 0%, var(--navy) 75%, #030711 100%);
    font-family: 'Montserrat', sans-serif;
    padding: 24px;
    overflow: hidden;
  }

  .book {
    position: relative;
    width: 500px;
    height: 700px;
    perspective: 2500px;
  }

  .book-base {
    position: absolute;
    inset: 0;
    background: linear-gradient(160deg, #0b1632 0%, var(--navy) 100%);
    border-radius: 2px 10px 10px 2px;
    box-shadow:
      0 30px 70px rgba(0,0,0,0.6),
      inset -6px 0 14px rgba(0,0,0,0.4);
  }

  .page {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
    transform-origin: left center;
    transition: transform 0.9s cubic-bezier(.63,.06,.27,1.01);
    cursor: pointer;
  }

  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 2px 10px 10px 2px;
    padding: 32px 26px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    background: linear-gradient(160deg, #0e1a38 0%, #0b1632 100%);
    color: var(--text-main);
    box-shadow: inset 0 0 0 1px rgba(191,227,240,0.15);
  }

  .cover-image {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 2px 10px 10px 2px;
  }

  .cover-front {
    padding: 0;
    overflow: hidden;
  }

  .cover-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
        to top,
        rgba(0,0,0,0.15),
        rgba(0,0,0,0.02)
    );
  }

  .face.back { transform: rotateY(180deg); }

  .face::before {
    content: "";
    position: absolute;
    inset: 10px;
    border: 1px solid rgba(191,227,240,0.35);
    pointer-events: none;
  }

  .page-num {
    position: absolute;
    bottom: 14px;
    right: 20px;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--pastel-blue);
    opacity: 0.6;
    z-index: 10;
  }

  /* Left pages turn backwards, reposition page numbers to bottom-left */
  .face.back .page-num {
    right: auto;
    left: 20px;
  }

  .controls {
    display: flex;
    gap: 14px;
  }

  button {
    font-family: 'Montserrat', sans-serif;
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    background: transparent;
    border: 1px solid var(--pastel-blue);
    color: var(--pastel-blue);
    padding: 10px 20px;
    border-radius: 25px;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }
  button:hover { background: var(--pastel-blue); color: var(--navy); }
  button:disabled { opacity: 0.3; cursor: default; }
  button:disabled:hover { background: transparent; color: var(--pastel-blue); }

  .hint {
    font-size: 10px;
    letter-spacing: 1.5px;
    color: rgba(191,227,240,0.55);
    text-align: center;
  }
</style>
</head>
<body>

<div class="book" id="book">
  

  <!-- Physical Page 1 (Contains Viewable Page 1 & 2) -->
  <div class="page" data-index="0">
    <div class="face front cover-front">
      <img src="1.png" alt="Wedding Cover 1" class="cover-image">
      <div class="cover-overlay"></div>
      <div class="page-num">01</div>
    </div>
    <div class="face back">
      <img src="2.png" alt="Wedding Cover 2" class="cover-image">
      <div class="page-num">02</div>
    </div>
  </div>

  <!-- Physical Page 2 (Contains Viewable Page 3 & 4) -->
  <div class="page" data-index="1">
    <div class="face front">
      <img src="3.png" alt="Wedding Cover 3" class="cover-image">
      <div class="page-num">03</div>
    </div>
    <div class="face back">
      <img src="4.png" alt="Wedding Cover 4" class="cover-image">
      <div class="page-num">04</div>
    </div>
  </div>
</div>

<div class="controls">
  <button id="prevBtn">◂ Prev</button>
  <button id="nextBtn">Next ▸</button>
</div>
<div class="hint">click a page, or use the buttons, to flip</div>

<script>
  const pages = Array.from(document.querySelectorAll('.page'));
  const total = pages.length;
  let current = 0;

  function layout() {
    pages.forEach((page, i) => {
      if (i < current) {
        page.style.transform = 'rotateY(-180deg)';
        page.style.zIndex = i;
      } else {
        page.style.transform = 'rotateY(0deg)';
        page.style.zIndex = total - i;
      }
    });
    document.getElementById('prevBtn').disabled = current === 0;
    document.getElementById('nextBtn').disabled = current === total;
  }

  function flipNext() { if (current < total) { current++; layout(); } }
  function flipPrev() { if (current > 0) { current--; layout(); } }

  pages.forEach((page, i) => {
    page.addEventListener('click', () => {
      if (i === current) flipNext();
      else if (i === current - 1) flipPrev();
    });
  });

  document.getElementById('nextBtn').addEventListener('click', flipNext);
  document.getElementById('prevBtn').addEventListener('click', flipPrev);

  layout();
</script>

</body>
</html>
