<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Flip Card Invitation | Dickson & Michelle</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=IM+Fell+DW+Pica:ital@0;1&family=Montserrat:wght@200;300;400;600;700&family=Pinyon+Script&family=Playfair+Display:ital,wght@0,700;1,400&family=Satisfy&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #060e1f;
    --pastel-blue: #bfe3f0;
    --light-pastel-blue: #e0f2f7;
    --pastel-blue-glass: rgba(174, 198, 207, 0.7);
    --maroon-nav: #6b0f0f;
    --text-main: #ffffff;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    background: radial-gradient(ellipse at center, #0d1a35 0%, var(--navy) 75%, #030711 100%);
    font-family: 'Montserrat', sans-serif;
    padding: 24px;
    overflow: auto;
  }

  /* Single flip card, sized to fit within the viewport on any device */
  .card-stage {
    position: relative;
    width: min(420px, 88vw, calc(78vh * 5 / 7));
    aspect-ratio: 5 / 7;
    perspective: 2200px;
  }

  .card {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
    transition: transform 0.8s cubic-bezier(.63,.06,.27,1.01);
    cursor: pointer;
  }

  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 10px;
    overflow: hidden;
    background: linear-gradient(160deg, #0e1a38 0%, #0b1632 100%);
    box-shadow:
      0 25px 60px rgba(0,0,0,0.55),
      inset 0 0 0 1px rgba(191,227,240,0.15);
  }

  .face.back { transform: rotateY(180deg); }

  .face img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .page-num {
    position: absolute;
    bottom: 14px;
    right: 20px;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--pastel-blue);
    opacity: 0.75;
    z-index: 2;
    font-family: 'Montserrat', sans-serif;
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  button {
    font-family: 'Montserrat', sans-serif;
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    background: transparent;
    border: 1px solid var(--pastel-blue);
    color: var(--pastel-blue);
    padding: 10px 20px;
    border-radius: 25px;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }
  button:hover { background: var(--pastel-blue); color: var(--navy); }
  button:disabled { opacity: 0.3; cursor: default; }
  button:disabled:hover { background: transparent; color: var(--pastel-blue); }

  .counter {
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--pastel-blue);
    opacity: 0.8;
    min-width: 40px;
    text-align: center;
  }

  .hint {
    font-size: 10px;
    letter-spacing: 1.5px;
    color: rgba(191,227,240,0.55);
    text-align: center;
  }
</style>
</head>
<body>

<div class="card-stage">
  <div class="card" id="card">
    <div class="face front">
      <img id="imgFront" src="img/1.png" alt="Wedding invitation">
      <div class="page-num" id="numFront">01</div>
    </div>
    <div class="face back">
      <img id="imgBack" src="img/2.png" alt="Wedding invitation">
      <div class="page-num" id="numBack">02</div>
    </div>
  </div>
</div>

<div class="controls">
  <button id="prevBtn">◂ Prev</button>
  <span class="counter" id="counter">1 / 4</span>
  <button id="nextBtn">Next ▸</button>
</div>
<div class="hint">tap the card, or use the buttons, to flip</div>

<script>
  const images = ['img/1.webp', 'img/2.webp', 'img/3.webp', 'img/4.webp'];
  const total = images.length;

  const card = document.getElementById('card');
  const imgFront = document.getElementById('imgFront');
  const imgBack = document.getElementById('imgBack');
  const numFront = document.getElementById('numFront');
  const numBack = document.getElementById('numBack');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const counter = document.getElementById('counter');

  let idx = 0;   // index of the currently visible image
  let rot = 0;   // cumulative rotation in degrees (multiples of 180)

  function pad(n) { return String(n + 1).padStart(2, '0'); }

  function updateControls() {
    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === total - 1;
    counter.textContent = (idx + 1) + ' / ' + total;
  }

  function go(direction) {
    const nextIdx = idx + direction;
    if (nextIdx < 0 || nextIdx > total - 1) return;

    rot += 180 * direction;
    idx = nextIdx;

    // Which face will be facing forward after this flip?
    const showingFront = (((rot / 180) % 2) + 2) % 2 === 0;

    if (showingFront) {
      imgFront.src = images[idx];
      numFront.textContent = pad(idx);
    } else {
      imgBack.src = images[idx];
      numBack.textContent = pad(idx);
    }

    card.style.transform = 'rotateY(' + rot + 'deg)';
    updateControls();
  }

  card.addEventListener('click', () => go(1));
  nextBtn.addEventListener('click', (e) => { e.stopPropagation(); go(1); });
  prevBtn.addEventListener('click', (e) => { e.stopPropagation(); go(-1); });

  updateControls();
</script>

</body>
</html>
